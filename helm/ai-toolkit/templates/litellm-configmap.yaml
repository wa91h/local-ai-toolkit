{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-toolkit.fullname" . }}-litellm-config
  labels:
    {{- include "ai-toolkit.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      {{- with .Values.litellm.extraModels }}
      {{- . | nindent 6 }}
      {{- else }} []
      {{- end }}
    general_settings:
      store_model_in_db: true       # Logs model name in spend/activity logs
      store_prompts_in_spend_logs: true # Saves prompt text for debugging
{{- end }}
