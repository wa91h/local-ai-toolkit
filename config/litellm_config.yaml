# LiteLLM model registry.
#
# Ships empty — no models are pre-configured. Add models in one of two ways:
#   - append model_list entries here, then `docker compose restart litellm`
#   - add them at runtime in the LiteLLM UI (http://localhost:4000/ui);
#     STORE_MODEL_IN_DB=True persists them to Postgres.
#
# Example entry:
#   - model_name: my-model
#     litellm_params:
#       model: openai/gpt-4o
#       api_key: os.environ/OPENAI_API_KEY

general_settings:
  store_model_in_db: true       # Logs model name in spend/activity logs
  store_prompts_in_spend_logs: true # Saves prompt text for debugging

model_list: []
